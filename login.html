<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0d5c63">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Log in — TravelConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav id="navbar" class="navbar"></nav>

<div class="container-narrow" style="max-width: 460px;">
  <div class="card card-body" style="padding: 32px;">
    <div class="center mb-24">
      <div class="brand-mark" style="width:52px;height:52px;font-size:24px;margin:0 auto 12px;">🌏</div>
      <h2 style="font-size:26px;">Welcome back</h2>
      <p class="muted text-sm mt-4">Log in to continue your journey.</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Email or username</label>
        <input type="text" name="emailOrUsername" required autofocus placeholder="wanderer_sai or wanderer_sai@travelconnect.dev"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="password123"/>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="center muted text-sm mt-24">
      New here? <a href="register.html" style="color:var(--primary);font-weight:500">Create an account</a>
    </p>

    <div class="mt-24" style="padding: 14px; background: var(--surface-alt); border-radius: var(--radius-sm); font-size: 13px;">
      <strong>Try sample accounts:</strong><br>
      • <code>wanderer_sai</code> / <code>password123</code><br>
      • <code>admin</code> / <code>password123</code>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  (function initLoginPage () {
    renderNavbar('login');

    // If already logged in, jump straight to the feed.
    // The `return` short-circuits the rest so we don't wire the form redundantly.
    if (API.currentUser()) {
      window.location.replace('home.html');
      return;
    }

    const form = document.getElementById('login-form');
    if (!form) return;
    form.addEventListener('submit', function onLoginSubmit (e) {
      e.preventDefault();
      const fd = new FormData(form);
      const emailOrUsername = (fd.get('emailOrUsername') || '').trim();
      const password = fd.get('password') || '';

      if (!emailOrUsername || !password) {
        toast('Please fill in both fields', 'danger');
        return;
      }

      try {
        const user = API.login({ emailOrUsername, password });
        toast('Welcome back, ' + user.name, 'success');
        setTimeout(() => window.location.replace('home.html'), 400);
      } catch (err) {
        toast(err.message || 'Login failed', 'danger');
      }
    });
  })();
</script>

</body>
</html>
