<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0d5c63">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Communities — TravelConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav id="navbar" class="navbar"></nav>

<main class="container">
  <div class="section-head">
    <div>
      <div class="chip mb-8">Communities</div>
      <h2>Find your people</h2>
    </div>
    <button class="btn btn-primary" id="btn-new-community">+ Create community</button>
  </div>

  <div class="grid grid-3" id="community-grid"></div>
</main>

<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar('communities');
  const me = API.currentUser();

  function render() {
    const cs = API.listCommunities();
    const grid = document.getElementById('community-grid');
    grid.innerHTML = cs.map(c => {
      const cat = catInfo(c.category);
      const joined = me && c.members.includes(me.id);
      const memberUsers = c.members.slice(0, 5).map(id => API.getUser(id)).filter(Boolean);
      return `
        <article class="card">
          <div class="card-body">
            <div class="row-between mb-8">
              <span class="chip" style="background:${cat.color}22;color:${cat.color}">${cat.emoji} ${cat.name}</span>
              <span class="muted text-sm">${c.members.length} members</span>
            </div>
            <h3 style="font-size:20px">${escapeHtml(c.name)}</h3>
            <p class="muted text-sm mt-8">${escapeHtml(c.description)}</p>
            <div class="row mt-16" style="gap:0">
              ${memberUsers.map((u, i) => `
                <div style="margin-left:${i === 0 ? 0 : -10}px">${renderAvatar(u, 'avatar-sm')}</div>
              `).join('')}
              ${c.members.length > 5 ? `<div class="muted text-sm" style="margin-left:8px">+${c.members.length - 5}</div>` : ''}
            </div>
            <button class="btn ${joined ? 'btn-secondary' : 'btn-primary'} btn-block mt-16" data-join="${c.id}">
              ${joined ? '✓ Joined — Leave' : '+ Join community'}
            </button>
          </div>
        </article>
      `;
    }).join('');
  }
  render();

  document.getElementById('community-grid').addEventListener('click', e => {
    const btn = e.target.closest('[data-join]');
    if (!btn) return;
    if (!me) return window.location.href = 'login.html';
    const id = btn.dataset.join;
    const c = API.getCommunity(id);
    if (c.members.includes(me.id)) { API.leaveCommunity(id); toast('Left ' + c.name); }
    else { API.joinCommunity(id); toast('Joined ' + c.name, 'success'); }
    render();
  });

  document.getElementById('btn-new-community').addEventListener('click', () => {
    if (!me) return window.location.href = 'login.html';
    const cats = CATEGORIES.map(c => `<option value="${c.id}">${c.emoji} ${c.name}</option>`).join('');
    const m = openModal(`
      <div class="modal-header"><h3>Create community</h3><button class="modal-close" data-close>×</button></div>
      <form id="nc-form" class="modal-body">
        <div class="form-group"><label>Name</label><input name="name" required placeholder="Solo cyclists"></div>
        <div class="form-group"><label>Category</label><select name="category">${cats}</select></div>
        <div class="form-group"><label>Description</label><textarea name="description" required placeholder="What is this community about?"></textarea></div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close>Cancel</button>
        <button class="btn btn-primary" id="nc-save">Create</button>
      </div>
    `);
    m.root.querySelector('#nc-save').addEventListener('click', () => {
      const fd = new FormData(m.root.querySelector('#nc-form'));
      API.createCommunity({
        name: fd.get('name'),
        category: fd.get('category'),
        description: fd.get('description'),
      });
      m.close();
      toast('Community created', 'success');
      render();
    });
  });
</script>

</body>
</html>
