<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0d5c63">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Admin — TravelConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/analytics.css"/>
</head>
<body>

<nav id="navbar" class="navbar"></nav>

<main class="container">
  <div class="section-head">
    <div>
      <div class="chip chip-danger mb-8">🛡 Admin</div>
      <h2>Moderation dashboard</h2>
    </div>
    <button class="btn btn-secondary" id="btn-add-dest">+ Add destination</button>
  </div>

  <div id="admin-check"></div>
  <div id="admin-panels" hidden>
    <div class="stat-grid" id="stat-grid"></div>

    <h3 style="font-size:20px" class="mb-16 mt-32">Reports queue</h3>
    <table class="table">
      <thead><tr><th>When</th><th>Reporter</th><th>Target</th><th>Reason</th><th>Status</th><th></th></tr></thead>
      <tbody id="reports-tbody"></tbody>
    </table>

    <h3 style="font-size:20px" class="mb-16 mt-32">Users</h3>
    <table class="table">
      <thead><tr><th>User</th><th>Role</th><th>Followers</th><th>Posts</th><th></th></tr></thead>
      <tbody id="users-tbody"></tbody>
    </table>
  </div>
</main>

<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar('admin');
  const me = API.currentUser();
  const check = document.getElementById('admin-check');
  const panels = document.getElementById('admin-panels');

  if (!me) {
    check.innerHTML = `<div class="empty"><div class="empty-icon">🔒</div><h3>Log in required</h3><a class="btn btn-primary mt-16" href="login.html">Log in</a></div>`;
  } else if (me.role !== 'admin') {
    check.innerHTML = `<div class="empty"><div class="empty-icon">🚫</div><h3>Admins only</h3><p>Log in as <code>admin</code> / <code>password123</code> to access this dashboard.</p></div>`;
  } else {
    panels.hidden = false;
    renderPanels();
  }

  function renderPanels() {
    const stats = API.platformStats();
    document.getElementById('stat-grid').innerHTML = `
      <div class="stat-card"><div class="label">Users</div><div class="value">${stats.users}</div></div>
      <div class="stat-card"><div class="label">Posts</div><div class="value">${stats.posts}</div></div>
      <div class="stat-card"><div class="label">Destinations</div><div class="value">${stats.destinations}</div></div>
      <div class="stat-card"><div class="label">Communities</div><div class="value">${stats.communities}</div></div>
      <div class="stat-card"><div class="label">Pending reports</div><div class="value">${API.listReports('pending').length}</div></div>
    `;

    // Reports
    const reports = API.listReports();
    document.getElementById('reports-tbody').innerHTML = reports.length
      ? reports.map(r => {
          const reporter = API.getUser(r.reporterId);
          return `
            <tr>
              <td class="muted text-sm">${timeAgo(r.createdAt)}</td>
              <td>@${escapeHtml(reporter?.username || '?')}</td>
              <td>${escapeHtml(r.targetType)} · <code>${escapeHtml(r.targetId)}</code></td>
              <td>${escapeHtml(r.reason)}</td>
              <td><span class="chip ${r.status==='resolved'?'chip-success':r.status==='dismissed'?'chip-accent':'chip-danger'}">${r.status}</span></td>
              <td class="report-row-actions">
                ${r.status === 'pending' ? `
                  <button class="btn btn-sm btn-primary" data-resolve="${r.id}">Resolve</button>
                  <button class="btn btn-sm btn-secondary" data-dismiss="${r.id}">Dismiss</button>
                ` : ''}
              </td>
            </tr>
          `;
        }).join('')
      : '<tr><td colspan="6" class="muted text-sm center" style="padding:24px">No reports 🎉</td></tr>';

    // Users
    const users = DB.load().users;
    document.getElementById('users-tbody').innerHTML = users.map(u => `
      <tr>
        <td>
          <div class="row" style="gap:8px">
            ${renderAvatar(u, 'avatar-sm')}
            <div>
              <strong><a href="profile.html?u=${escapeHtml(u.username)}">${escapeHtml(u.name)}</a></strong>
              <div class="muted text-sm">@${escapeHtml(u.username)}</div>
            </div>
          </div>
        </td>
        <td><span class="chip">${escapeHtml(u.role)}</span></td>
        <td>${API.followerCount(u.id)}</td>
        <td>${API.listPosts({userId:u.id}).length}</td>
        <td class="report-row-actions">
          ${u.id !== me.id ? `<button class="btn btn-sm btn-danger" data-delete-user="${u.id}">Delete</button>` : `<span class="muted text-sm">— you —</span>`}
        </td>
      </tr>
    `).join('');
  }

  document.body.addEventListener('click', e => {
    const r  = e.target.closest('[data-resolve]');
    const d  = e.target.closest('[data-dismiss]');
    const du = e.target.closest('[data-delete-user]');
    if (r) { API.updateReport(r.dataset.resolve, 'resolved'); toast('Resolved'); renderPanels(); }
    if (d) { API.updateReport(d.dataset.dismiss, 'dismissed'); toast('Dismissed'); renderPanels(); }
    if (du) {
      const uid = du.dataset.deleteUser;
      const u = API.getUser(uid);
      const m = openModal(`
        <div class="modal-header"><h3>Delete user?</h3><button class="modal-close" data-close>×</button></div>
        <div class="modal-body">
          <p>Delete <strong>@${escapeHtml(u?.username || uid)}</strong> and all their posts, follows and profile entries.</p>
          <p class="muted text-sm mt-8">This can't be undone (until you Reset demo data).</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-close>Cancel</button>
          <button class="btn btn-danger" id="c-del">Delete user</button>
        </div>
      `);
      m.root.querySelector('#c-del').addEventListener('click', () => {
        API.deleteUser(uid);
        m.close();
        toast('User deleted', 'danger');
        renderPanels();
      });
    }
  });

  document.getElementById('btn-add-dest').addEventListener('click', () => {
    if (!me || me.role !== 'admin') return;
    const cats = CATEGORIES.map(c => `<option value="${c.id}">${c.emoji} ${c.name}</option>`).join('');
    const m = openModal(`
      <div class="modal-header"><h3>Add destination</h3><button class="modal-close" data-close>×</button></div>
      <form id="ad-form" class="modal-body">
        <div class="form-group"><label>Name</label><input name="name" required></div>
        <div class="form-group"><label>Country / region</label><input name="country" required></div>
        <div class="form-group"><label>Category</label><select name="category">${cats}</select></div>
        <div class="form-group"><label>Image URL</label><input name="image" type="url" required></div>
        <div class="form-group"><label>Description</label><textarea name="description" required></textarea></div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close>Cancel</button>
        <button class="btn btn-primary" id="ad-save">Add</button>
      </div>
    `);
    m.root.querySelector('#ad-save').addEventListener('click', () => {
      const fd = new FormData(m.root.querySelector('#ad-form'));
      try {
        API.addDestination({
          name: fd.get('name'),
          country: fd.get('country'),
          category: fd.get('category'),
          image: fd.get('image'),
          description: fd.get('description'),
        });
        m.close();
        toast('Destination added', 'success');
        renderPanels();
      } catch (err) { toast(err.message, 'danger'); }
    });
  });
</script>

</body>
</html>
