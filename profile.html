<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0d5c63">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Profile — TravelConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/home.css"/>
  <link rel="stylesheet" href="css/profile.css"/>
</head>
<body>

<nav id="navbar" class="navbar"></nav>

<main class="container">
  <div class="profile-header" id="profile-header"></div>
  <div class="profile-tabs" id="profile-tabs"></div>
  <section id="profile-content"></section>
</main>

<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/posts.js"></script>
<script src="js/profile.js"></script>
<script>
  renderNavbar('profile');

  // Which profile are we looking at? ?u=username, else self
  const requestedUsername = qs('u');
  const me = API.currentUser();

  if (requestedUsername) {
    profileUser = API.getUser(requestedUsername);
  } else if (me) {
    profileUser = me;
  }

  if (!profileUser) {
    document.querySelector('main').innerHTML = `
      <div class="empty">
        <div class="empty-icon">👤</div>
        <h3>User not found</h3>
        <p>This account doesn't exist.</p>
        <a class="btn btn-primary mt-16" href="home.html">Back to feed</a>
      </div>`;
  } else {
    const tabParam = qs('tab');
    if (tabParam && PROFILE_TABS.some(t => t.key === tabParam)) currentTab = tabParam;
    renderProfile();
  }
</script>

</body>
</html>
