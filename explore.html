<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0d5c63">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Explore — TravelConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav id="navbar" class="navbar"></nav>

<main class="container">
  <div class="section-head">
    <div>
      <div class="chip mb-8">Explore</div>
      <h2>Destinations across the world</h2>
    </div>
    <div>
      <input id="dest-search" type="text" placeholder="Search destination or country…" style="width:280px">
    </div>
  </div>

  <div class="category-pills" id="cat-pills"></div>

  <div class="grid grid-3" id="dest-grid"></div>
</main>

<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/posts.js"></script>
<script>
  renderNavbar('explore');

  let currentCat = qs('cat') || '';
  let currentQ = qs('q') || '';

  // Category pills
  function renderPills() {
    const pills = document.getElementById('cat-pills');
    pills.innerHTML = `
      <button class="category-pill ${!currentCat ? 'active' : ''}" data-cat="">All</button>
      ${CATEGORIES.map(c => `
        <button class="category-pill ${currentCat === c.id ? 'active' : ''}" data-cat="${c.id}">
          <span>${c.emoji}</span><span>${c.name}</span>
        </button>
      `).join('')}
    `;
    pills.querySelectorAll('.category-pill').forEach(b => {
      b.addEventListener('click', () => {
        currentCat = b.dataset.cat;
        renderPills();
        renderGrid();
        history.replaceState({}, '', 'explore.html' + (currentCat ? '?cat=' + currentCat : ''));
      });
    });
  }

  function renderGrid() {
    const dests = API.listDestinations({ category: currentCat || undefined, search: currentQ });
    const grid = document.getElementById('dest-grid');
    if (!dests.length) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
        <div class="empty-icon">🔎</div>
        <h3>Nothing matches</h3><p>Try another category or search term.</p>
      </div>`;
      return;
    }
    grid.innerHTML = dests.map(d => {
      const cat = catInfo(d.category);
      const postCount = API.listPosts({}).filter(p => p.destinationId === d.id).length;
      return `
        <article class="card">
          <div class="post-image" style="aspect-ratio:5/3;background:${cat.color}22">
            <img src="${escapeHtml(d.image)}" alt="${escapeHtml(d.name)}" loading="lazy"
                 onerror="this.style.display='none';this.parentElement.classList.add('ph-img');this.parentElement.innerHTML='📍 ${escapeHtml(d.name)}'">
          </div>
          <div class="card-body">
            <div class="row-between mb-8">
              <h3 style="font-size:20px">${escapeHtml(d.name)}</h3>
              <span class="chip" style="background:${cat.color}22;color:${cat.color}">${cat.emoji} ${cat.name}</span>
            </div>
            <div class="muted text-sm mb-8">📍 ${escapeHtml(d.country)}</div>
            <p class="text-sm">${escapeHtml(d.description)}</p>
            <div class="row-between mt-16">
              <span class="muted text-sm">${postCount} posts</span>
              <div class="row" style="gap:6px">
                <button class="btn btn-ghost btn-sm" data-visited="${d.id}">✓ Visited</button>
                <button class="btn btn-primary btn-sm" data-bucket="${d.id}">+ Bucket list</button>
              </div>
            </div>
          </div>
        </article>
      `;
    }).join('');
  }

  renderPills();
  renderGrid();

  document.getElementById('dest-search').value = currentQ;
  document.getElementById('dest-search').addEventListener('input', e => {
    currentQ = e.target.value;
    renderGrid();
  });

  document.getElementById('dest-grid').addEventListener('click', e => {
    const me = API.currentUser();
    if (!me) return window.location.href = 'login.html';

    const vb = e.target.closest('[data-visited]');
    const bb = e.target.closest('[data-bucket]');
    if (vb) {
      const dest = API.getDestination(vb.dataset.visited);
      API.addCollection('visited', {
        destinationId: dest.id,
        title: dest.name,
        place: dest.country,
        notes: '',
        rating: 5,
        date: new Date().toISOString().slice(0,7),
        image: dest.image,
      });
      toast(dest.name + ' → Visited', 'success');
    }
    if (bb) {
      const dest = API.getDestination(bb.dataset.bucket);
      API.addCollection('bucket', {
        destinationId: dest.id,
        title: dest.name,
        place: dest.country,
        notes: '',
        priority: 'medium',
        image: dest.image,
      });
      toast(dest.name + ' → Bucket list', 'success');
    }
  });
</script>

</body>
</html>
